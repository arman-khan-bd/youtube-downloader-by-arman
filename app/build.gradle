plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tubepipe.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.tubepipe.app"
        minSdk 21 // Android 5.0 (Lollipop)
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE") ?: "release.keystore"
            def ksFile = file(ksPath)
            if (!ksFile.exists()) {
                ksFile = rootProject.file(ksPath)
            }
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "android"
                keyAlias System.getenv("KEY_ALIAS") ?: "tubepipe"
                keyPassword System.getenv("KEY_PASSWORD") ?: "android"
            }
        }
    }

    buildTypes {
        release {
            def ksPath = System.getenv("KEYSTORE_FILE") ?: "release.keystore"
            def ksFile = file(ksPath)
            if (!ksFile.exists()) {
                ksFile = rootProject.file(ksPath)
            }
            if (ksFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // UI & Support Libraries (Supports API 21+)
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // NewPipe Extractor (YouTube & Streaming technology)
    implementation 'com.github.teamnewpipe:NewPipeExtractor:v0.24.4'

    // yt-dlp Native Android Wrapper (For YT, FB, TikTok, IG, etc.)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.17.2'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.17.2'

    // ExoPlayer Media3 (Streaming & offline video playback)
    implementation 'androidx.media3:media3-exoplayer:1.2.1'
    implementation 'androidx.media3:media3-ui:1.2.1'
    implementation 'androidx.media3:media3-common:1.2.1'
    implementation 'androidx.media3:media3-session:1.2.1'
    implementation 'androidx.media:media:1.7.0'

    // Image loading with Glide
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Networking & JSON
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}
